{% extends "base.html" %}
{% block content %}
<h1>Challenges</h1>
<table><tr><th>Title</th><th>Category</th><th>Diff</th><th>Pts</th><th>Active</th><th></th></tr>
{% for r in rows %}
<tr>
  <td>{{ r.title }}</td><td>{{ r.category }}</td><td>{{ r.difficulty }}</td><td>{{ r.points }}</td>
  <td>{{ '✅' if r.is_active else '—' }}</td>
  <td><form method="post" action="{{ url_for('admin_toggle_challenge', cid=r.id) }}">
    <button class="ghost">{{ 'Deactivate' if r.is_active else 'Activate' }}</button></form></td>
</tr>
{% endfor %}
</table>
{% endblock %}
